<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Server Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#0b1110;--line:#263831;--text:#e9f4ef;--muted:#9ab0a5;--accent:#3df2a6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172b23,var(--bg) 55%);font:15px/1.5 system-ui;color:var(--text)}main{max-width:1000px;margin:auto;padding:44px 22px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:700}h1{font-size:clamp(30px,5vw,44px);margin:10px 0}p{color:var(--muted)}.panel{margin-top:28px;background:#121c19ef;border:1px solid var(--line);border-radius:18px;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.count{font-size:30px;font-weight:750}.pill{border:1px solid #285c46;background:#153526;color:var(--accent);border-radius:99px;padding:5px 10px;font-size:12px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase}.empty{text-align:center;padding:36px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px}@media(max-width:600px){main{padding:25px 14px}.panel{padding:14px}.hide-mobile{display:none}}
</style></head><body><main><div class="eyebrow">Socket File Sharing · Server</div><h1>Server dashboard</h1><p>Clients that have sent a heartbeat in the last 30 seconds.</p><section class="panel"><div class="top"><div><div class="count" id="count">—</div><div style="color:var(--muted)">Active clients</div></div><span class="pill"><span class="dot"></span>Live updates</span></div><table><thead><tr><th>Client</th><th>IP address</th><th class="hide-mobile">Client ID</th><th>Last seen</th></tr></thead><tbody id="clients"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody></table><p id="status"></p></section></main>
<script>
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){try{const r=await fetch('/api/clients',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Server error');document.getElementById('count').textContent=d.clients.length;document.getElementById('clients').innerHTML=d.clients.length?d.clients.map(c=>`<tr><td><span class="dot"></span>${esc(c.name)}</td><td>${esc(c.ip)}</td><td class="hide-mobile">${esc(c.client_id)}</td><td>${esc(c.last_seen)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No active clients yet. Open a client dashboard.</td></tr>';document.getElementById('status').textContent='Updated just now'}catch(e){document.getElementById('status').textContent='Error: '+e.message}}refresh();setInterval(refresh,3000)
</script></body></html>
