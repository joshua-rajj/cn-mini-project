<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Server Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; color: #222; }
    h1 { margin-bottom: 4px; }
    .sub { color: #666; margin-top: 0; }
    table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
    th { background: #eaeaea; }
    .empty { text-align: center; color: #888; }
  </style>
</head>
<body>
  <h1>Server Dashboard</h1>
  <p class="sub">Clients that sent a heartbeat in the last 30 seconds.</p>

  <table>
    <thead>
      <tr>
        <th>Client</th>
        <th>IP address</th>
        <th>Client ID</th>
        <th>Last seen</th>
      </tr>
    </thead>
    <tbody id="clients">
      <tr><td colspan="4" class="empty">Loading...</td></tr>
    </tbody>
  </table>

  <script>
    async function refresh() {
      const response = await fetch('/api/clients');
      const data = await response.json();
      const table = document.getElementById('clients');

      if (data.clients.length === 0) {
        table.innerHTML = '<tr><td colspan="4" class="empty">No clients online</td></tr>';
        return;
      }

      table.innerHTML = data.clients.map(function (client) {
        return '<tr>' +
          '<td>' + client.name + '</td>' +
          '<td>' + client.ip + '</td>' +
          '<td>' + client.client_id + '</td>' +
          '<td>' + client.last_seen + '</td>' +
          '</tr>';
      }).join('');
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
