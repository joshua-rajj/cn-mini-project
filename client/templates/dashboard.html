<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Client Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; color: #222; max-width: 800px; }
    h1 { margin-bottom: 4px; }
    h2 { margin-top: 28px; }
    .sub { color: #666; margin-top: 0; }
    .box { background: white; padding: 18px; border: 1px solid #ddd; }
    input[type=password], input[type=file] { padding: 8px; }
    button { padding: 8px 14px; cursor: pointer; }
    ul { background: white; padding: 18px 18px 18px 38px; border: 1px solid #ddd; }
    li { padding: 8px 0; border-bottom: 1px solid #eee; }
    a { color: #0a5; }
    .size { color: #777; font-size: 13px; }
    .error { color: #b00; }
  </style>
</head>
<body>
  <h1>Client Dashboard</h1>
  <p class="sub">{{ client_name }} ({{ client_id }}) &middot; server {{ server_host }}:{{ server_port }}</p>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  {% if not logged_in %}

    <h2>Login</h2>
    <div class="box">
      <form method="post" action="/login">
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Log in</button>
      </form>
    </div>

  {% else %}

    <p class="box">
      Logged in as <strong>{{ client_name }}</strong>.
      <form method="post" action="/logout" style="display:inline">
        <button type="submit">Log out</button>
      </form>
    </p>

    <h2>Upload a file</h2>
    <div class="box">
      <form method="post" action="/upload" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Upload</button>
      </form>
    </div>

    <h2>Files on the server</h2>
    <ul id="files"><li>Loading...</li></ul>

    <script>
      async function refresh() {
        const list = document.getElementById('files');
        try {
          const response = await fetch('/api/files');
          const data = await response.json();
          if (!data.ok) {
            throw new Error(data.error);
          }

          if (data.files.length === 0) {
            list.innerHTML = '<li>No files on the server.</li>';
            return;
          }

          list.innerHTML = data.files.map(function (file) {
            return '<li>' +
              '<a href="/download/' + encodeURIComponent(file.filename) + '">' + file.filename + '</a>' +
              ' <span class="size">(' + file.size + ' bytes, ' + file.owner + ', ' + file.upload_time + ')</span>' +
              '</li>';
          }).join('');
        } catch (error) {
          list.innerHTML = '<li class="error">Could not reach the server: ' +
            error.message + '</li>';
        }
      }

      refresh();
      setInterval(refresh, 10000);
    </script>

  {% endif %}
</body>
</html>
